name: Sync upstream releases

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/duckdb/duckdb.git || true
          git fetch upstream --tags

      - name: Check for new release
        id: check
        run: |
          LATEST=$(git tag -l 'v*.*.*' --sort=-v:refname | grep -v rc | head -1)
          LATEST_RISCV=$(gh release list --json tagName --jq '.[].tagName' 2>/dev/null | grep riscv64 | head -1 | sed 's/-riscv64//' || echo "none")
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "latest_riscv=$LATEST_RISCV" >> "$GITHUB_OUTPUT"
          if [ "$LATEST" != "$LATEST_RISCV" ]; then
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "New: $LATEST (our latest: $LATEST_RISCV)"
          else
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Up to date: $LATEST"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger riscv64 release build
        if: steps.check.outputs.new == 'true'
        run: |
          gh workflow run riscv64-release.yml -f tag=${{ steps.check.outputs.latest }}
          echo "Triggered riscv64 build for ${{ steps.check.outputs.latest }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
